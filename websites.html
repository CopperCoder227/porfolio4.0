<!doctype html>
<html lang="en">

<head>
    <title>My Websites Portfolio</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SN Pro', sans-serif;
            overflow-x: hidden;
            background: #080918;
            color: #fff;
        }

        nav.top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px 30px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-nav-links {
            display: flex;
            gap: 30px;
        }

        .top-nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .top-nav-links a:hover {
            color: #64b5f6;
        }

        .parallax-container {
            position: relative;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-bg,
        .image-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .video-bg iframe,
        .video-bg video,
        .image-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-bg iframe,
        .video-bg video {
            pointer-events: none;
        }

        .hero-block,
        .section-label {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: min(90%, 980px);
            background: rgba(7, 15, 34, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
        }

        .hero-block h1,
        .section-label h1 {
            font-size: clamp(2.4rem, 4vw, 4.2rem);
            line-height: 1.02;
            color: #f3f7ff;
            margin: 0;
        }

        .section-label h1 {
            margin: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(240px, 1fr));
            gap: 30px;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-bubble {
            background: rgba(255, 255, 255, 0.96);
            color: #111;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-bubble:hover {
            transform: translateY(-10px);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.24);
        }

        .card-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 22px;
        }

        .card-title {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .card-bio {
            font-size: 0.98rem;
            color: #444;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .card-link {
            display: inline-block;
            background: #0f62fe;
            color: white;
            padding: 10px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            transition: background 0.3s ease;
        }

        .card-link:hover {
            background: #054edb;
        }

        @keyframes floatUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body * {
            animation: floatUp 0.28s ease-out both;
        }

        .web-section {
            scroll-margin-top: 80px;
        }

        .section-title {
            text-align: center;
            font-size: clamp(2rem, 3vw, 3rem);
            font-weight: 800;
            margin-bottom: 30px;
            color: #f8fbff;
        }

        .web-section-wrapper {
            padding: 40px 0 60px;
            background: linear-gradient(180deg, rgba(5, 15, 34, 0.95), rgba(7, 14, 30, 0.98));
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: #e6e9ef;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .carousel-slides {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            height: 100%;
        }

        .carousel-slide {
            flex-shrink: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-nav {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .carousel-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid rgba(15, 23, 42, 0.18);
        }

        .carousel-dot.active {
            background: #0f62fe;
            transform: scale(1.2);
        }

        @media (max-width: 1100px) {
            .cards-container {
                grid-template-columns: repeat(3, minmax(220px, 1fr));
            }
        }

        @media (max-width: 760px) {
            .cards-container {
                grid-template-columns: repeat(2, minmax(200px, 1fr));
            }

            .hero-block,
            .section-label {
                padding: 1.5rem 1.4rem;
            }
        }

        @media (max-width: 560px) {
            .parallax-container {
                min-height: 60vh;
            }

            .hero-block h1,
            .section-label h1 {
                font-size: 2.3rem;
            }

            .top-nav {
                padding: 12px 18px;
            }

            .top-nav-links {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <div class="top-nav-links">
            <a href="index.html#home">Home</a>
            <div class="dropdown">
                <a href="#" class="dropdown-toggle" onclick="event.preventDefault();">About</a>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="index.html#about">Me</a>
                    <a class="dropdown-item" href="index.html#future">Future</a>
                </div>
            </div>
            <div class="dropdown">
                <a href="websites.html" class="dropdown-toggle">Websites</a>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="#web1">Soph</a>
                    <a class="dropdown-item" href="#web2">Jr</a>
                    <a class="dropdown-item" href="#web3">Sr</a>
                    <a class="dropdown-item disabled" href="#" onclick="event.preventDefault();">Favos</a>
                </div>
            </div>
        </div>
    </nav>

    <div style="margin-top: 60px;"></div>

    <!-- Home Section -->
    <section class="parallax-container">
        <div class="video-bg">
            <iframe
                src="https://www.youtube.com/embed/gHy5o3GjDow?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&loop=1&playlist=gHy5o3GjDow&modestbranding=1&enablejsapi=1"
                title="Galaxy backdrop video" frameborder="0"
                allow="autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <div class="hero-block">

        </div>
    </section>

    <!-- Sophmore Section -->
    <section class="parallax-container">
        <div class="video-bg">
            <iframe
                src="https://www.youtube.com/embed/gHy5o3GjDow?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&loop=1&playlist=gHy5o3GjDow&modestbranding=1&enablejsapi=1"
                title="Galaxy backdrop video" frameborder="0"
                allow="autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

            <h1>Sophmore</h1>

    </section>

    <section class="web-section-wrapper">

            <div class="cards-container" id="web1-cards"></div>
        </div>
    </section>

    <!-- Junior Section -->
    <section class="parallax-container">
        <div class="video-bg">
            <video autoplay muted loop playsinline
                src="videos/700_F_641376619_yEqOvvxQ428FkaBHeU4fzsDIVKnm4YXV_ST.mp4"></video>
        </div>
        <div class="section-label">
            <h1>Junior</h1>
        </div>
    </section>

    <section class="web-section-wrapper">
        <div class="web-section" id="web2">
            <h2 class="section-title">Junior Projects</h2>
            <div class="cards-container" id="web2-cards"></div>
        </div>
    </section>

    <!-- Senior Section -->
    <section class="parallax-container">
        <div class="video-bg">
            <video autoplay muted loop playsinline src="videos/11584395-uhd_3840_2160_60fps.mp4"></video>
        </div>

    <section class="web-section-wrapper">
        <div class="web-section" id="web3">

    <footer class="container mt-5 mb-5 text-center">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script>
        // Load and display cards for each web section
        async function loadWebCards(webNumber) {
            try {
                const response = await fetch(`data/web${webNumber}.json`);
                const projects = await response.json();
                const container = document.getElementById(`web${webNumber}-cards`);

                projects.forEach(project => {
                    const card = createCard(project, webNumber);
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(`Error loading web${webNumber} data:`, error);
            }
        }

        function createCard(project, webNumber) {
            const card = document.createElement('div');
            card.className = 'card-bubble';

            const imagesHTML = project.images.length > 1
                ? createCarousel(project.images, webNumber)
                : `<img src="imgs/Web${webNumber}/${project.images[0]}" alt="${project.name}" class="card-image">`;

            card.innerHTML = `
        ${imagesHTML}
        <div class="card-content">
          <div class="card-title">${project.name}</div>
          <div class="card-bio">${project.bio}</div>
          <a href="${project.link}" target="_blank" class="card-link">View Website</a>
        </div>
      `;

            return card;
        }

        function createCarousel(images, webNumber) {
            const carouselHTML = `
        <div class="carousel-container">
          <div class="carousel-slides" data-carousel>
            ${images.map(img => `<img src="imgs/Web${webNumber}/${img}" class="carousel-slide" alt="Project image">`).join('')}
          </div>
          <div class="carousel-nav" data-nav>
            ${images.map((_, i) => `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-slide="${i}"></div>`).join('')}
          </div>
        </div>
      `;
            return carouselHTML;
        }

        // Initialize carousel functionality
        function initCarousels() {
            document.querySelectorAll('[data-carousel]').forEach(carousel => {
                const slides = carousel.querySelectorAll('.carousel-slide');
                const dots = carousel.parentElement.querySelectorAll('.carousel-dot');
                let currentIndex = 0;

                dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => {
                        currentIndex = index;
                        updateCarousel(carousel, currentIndex, slides);
                        updateDots(dots, currentIndex);
                    });
                });

                // Auto-scroll carousel
                setInterval(() => {
                    currentIndex = (currentIndex + 1) % slides.length;
                    updateCarousel(carousel, currentIndex, slides);
                    updateDots(dots, currentIndex);
                }, 5000);
            });
        }

        function updateCarousel(carousel, index, slides) {
            const scrollAmount = index * carousel.querySelector('.carousel-slide').offsetWidth;
            carousel.scrollLeft = scrollAmount;
        }

        function updateDots(dots, index) {
            dots.forEach(dot => dot.classList.remove('active'));
            dots[index].classList.add('active');
        }

        // Load all web sections on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadWebCards(1);
            loadWebCards(2);
            loadWebCards(3);

            setTimeout(initCarousels, 500);
        });
    </script>
</body>

</html>
